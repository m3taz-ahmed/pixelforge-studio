name: Keep codespace awake

# Keeps the public demo Codespace alive AND reachable:
#   1. Fast path: if the public URL already returns 200, do nothing.
#   2. Otherwise resolve the codespace for this repo by name (never a
#      hardcoded ID) — recreate it if it was deleted by retention.
#   3. Start it if stopped, relaunch the demo services, verify /up is
#      healthy INSIDE the codespace (no dependency on port visibility).
#   4. Re-assert port 8000 visibility=public — it silently reverts to
#      private on codespace restart/rebuild. That is why the previous
#      version failed permanently: every external curl got 302 -> pf-signin.
#   5. Final check: /up returns 200 through the public tunnel URL.
#
# CODESPACE_TOKEN must be a *classic* PAT with the `codespace` scope
# (fine-grained PATs cannot drive gh codespace ssh/ports).
# Delete this workflow when the codespace is no longer needed.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive-codespace
  cancel-in-progress: false

env:
  REPO: m3taz-ahmed/pixelforge-studio
  APP_PORT: '8000'
  HAS_CODESPACE_TOKEN: ${{ secrets.CODESPACE_TOKEN != '' }}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
    steps:
      - name: Guard — CODESPACE_TOKEN must exist
        run: |
          if [ "$HAS_CODESPACE_TOKEN" != "true" ]; then
            echo "::error::CODESPACE_TOKEN secret is missing or empty"
            exit 1
          fi

      - name: Resolve codespace for this repo (recreate if deleted)
        id: cs
        run: |
          set -e
          name=$(gh api "repos/$REPO/codespaces" --jq '.codespaces[0].name // empty')
          if [ -z "$name" ]; then
            echo "::notice::No codespace exists for $REPO — creating one"
            gh codespace create --repo "$REPO" --branch main \
              --devcontainer-path .devcontainer/devcontainer.json \
              --display-name "Pixelforge Studio Demo"
            name=$(gh api "repos/$REPO/codespaces" --jq '.codespaces[0].name // empty')
          fi
          if [ -z "$name" ]; then
            echo "::error::Could not resolve or create a codespace for $REPO"
            exit 1
          fi
          {
            echo "name=$name"
            echo "app_url=https://${name}-${APP_PORT}.app.github.dev"
          } >> "$GITHUB_OUTPUT"
          echo "codespace: $name"

      - name: Fast path — already healthy and public
        id: fast
        env:
          APP_URL: ${{ steps.cs.outputs.app_url }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$APP_URL/up" || echo 000)
          echo "app status: $code"
          [ "$code" = "200" ] && echo "healthy=true" >> "$GITHUB_OUTPUT" || true

      - name: Ensure codespace is running
        if: steps.fast.outputs.healthy != 'true'
        env:
          CODESPACE_NAME: ${{ steps.cs.outputs.name }}
        run: |
          set -e
          state=$(gh api "user/codespaces/$CODESPACE_NAME" --jq '.state')
          echo "state: $state"
          if [ "$state" != "Available" ]; then
            gh api -X POST "user/codespaces/$CODESPACE_NAME/start" >/dev/null
            for i in $(seq 1 30); do
              sleep 10
              state=$(gh api "user/codespaces/$CODESPACE_NAME" --jq '.state')
              echo "start poll $i: $state"
              [ "$state" = "Available" ] && break
            done
          fi
          if [ "$state" != "Available" ]; then
            echo "::error::codespace did not reach Available state"
            exit 1
          fi

      - name: Ensure demo services are up (inside the codespace)
        if: steps.fast.outputs.healthy != 'true'
        env:
          CODESPACE_NAME: ${{ steps.cs.outputs.name }}
        run: |
          # </dev/null on BOTH sides: start-demo.sh spawns nohup daemons that
          # otherwise inherit the SSH session's stdin and keep the channel
          # open forever after the remote script exits (ssh hangs, job times
          # out). timeout bounds any residual hang to 5 minutes.
          timeout 300 gh codespace ssh --codespace "$CODESPACE_NAME" -- '
            bash /workspaces/pixelforge-studio/.devcontainer/start-demo.sh </dev/null
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 http://localhost:8000/up || echo 000)
              echo "internal attempt $i: $code"
              [ "$code" = "200" ] && exit 0
              sleep 10
            done
            exit 1
          ' </dev/null

      - name: Re-assert public port visibility + verify public URL
        if: steps.fast.outputs.healthy != 'true'
        env:
          CODESPACE_NAME: ${{ steps.cs.outputs.name }}
          APP_URL: ${{ steps.cs.outputs.app_url }}
        run: |
          set -e
          timeout 120 gh codespace ports visibility "${APP_PORT}:public" --codespace "$CODESPACE_NAME" </dev/null
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$APP_URL/up" || echo 000)
            echo "public attempt $i: $code"
            [ "$code" = "200" ] && { echo "demo is publicly reachable at $APP_URL"; exit 0; }
            sleep 10
          done
          echo "::error::$APP_URL/up returned $code (expected 200)"
          exit 1
